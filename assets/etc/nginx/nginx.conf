user www-data;
worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';
  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 4096;
  server_names_hash_bucket_size 128;

  server_tokens off;

  client_max_body_size 256M;
  client_body_buffer_size 128k;

  # Brute-force throttle for /wp-login.php. Behind the StartOS edge proxy
  # $binary_remote_addr is effectively the edge IP, so this acts as a
  # global rate cap across all clients per site — still useful against
  # password-spray scripts.
  limit_req_zone $binary_remote_addr zone=wp_login:10m rate=5r/m;
  limit_req_status 429;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml text/javascript
             application/javascript application/json application/xml
             application/rss+xml image/svg+xml font/woff font/woff2;

  include /etc/nginx/http.d/*.conf;
}
